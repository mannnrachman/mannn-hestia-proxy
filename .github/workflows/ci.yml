name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # warnings+errors only: info-level notes (SC2016 single-quote nginx
          # maps, SC1091 unfollowed source) are intentional in this repo.
          shellcheck --severity=warning \
            install.sh uninstall.sh setup-backup-exclusions.sh \
            scripts/*.sh templates/*/*/*.sh

  render-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render templates and run nginx -t
        run: scripts/render-templates-test.sh
