# mannn-hestia-proxy — Rate limiting zone definitions
# Installed to /etc/nginx/conf.d/ — must be in http {} context.
# Used by limit_req zone=mannn / zone=mannn_static in the mannn-* templates.
# Key is per-domain + per-IP: one zone instance must not let traffic to one
# domain consume another domain's budget for the same client (shared NAT).
#
# CONVENTION: strict zone (mannn) only for dynamic requests; static assets use
# the loose zone (mannn_static). A dashboard page load pulls 50+ js/css/svg
# files at once and bursts past 10r/s -> 429 -> the page loader never finishes.
limit_req_zone $server_name$binary_remote_addr zone=mannn:10m rate=10r/s;

# Static assets need a much higher budget. 100r/s keeps abuse protection
# intact while letting a full page load through in one burst.
limit_req_zone $server_name$binary_remote_addr zone=mannn_static:10m rate=100r/s;
