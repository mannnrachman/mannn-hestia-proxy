# mannn-hestia-proxy — Rate limiting zone definition
# Installed to /etc/nginx/conf.d/ — must be in http {} context.
# Used by limit_req zone=mannn in all mannn-*.tpl / mannn-*.stpl templates.
# Key is per-domain + per-IP: one zone instance must not let traffic to one
# domain consume another domain's budget for the same client (shared NAT).
limit_req_zone $server_name$binary_remote_addr zone=mannn:10m rate=10r/s;
